  :root{
    --paper:#F6F1E4; --paper-deep:#EFE8D6; --line:#D9CDA8;
    --ink:#1F2A3C; --ink-soft:#5B6472; --margin:#A5322B; --brass:#B8863E; --success:#2F6B4F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:#e8c9a0;}

  #loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;color:var(--ink-soft);}

  header{background:var(--paper-deep);padding:18px 24px 0;}
  .header-inner{display:flex;align-items:center;gap:14px;max-width:1200px;margin:0 auto;}
  .crest{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex-shrink:0;}
  .school-name{font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
  .school-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
  .header-rule{max-width:1200px;margin:16px auto 0;height:4px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);}

  .body-wrap{max-width:1200px;margin:0 auto;display:flex;min-height:calc(100vh - 96px);}
  nav.rail{width:132px;flex-shrink:0;padding:20px 8px 20px 0;display:flex;flex-direction:column;gap:4px;}
  .rail-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding:0 10px 8px;}
  .rail-tab{position:relative;text-align:left;border:none;background:transparent;border-radius:6px 0 0 6px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;color:var(--ink-soft);width:100%;}
  .rail-tab.active{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--margin);}
  .rail-tab-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .rail-tab-meta{font-size:10.5px;color:var(--ink-soft);}
  .rail-due-dot{position:absolute;top:10px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--margin);}

  main{flex:1;background:var(--paper);border-left:1px solid var(--line);padding:24px 24px 40px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .toolbar-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .toolbar-count{color:var(--ink-soft);font-weight:400;font-size:15px;}
  .toolbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search-input{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;font-size:13.5px;width:220px;outline:none;}
  .due-toggle{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .add-btn{background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;}

  .table-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 14px;background:var(--paper-deep);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;}
  tr.row{cursor:pointer;border-bottom:1px solid var(--line);}
  tr.row:hover{background:#FBF8F0;}
  td{padding:10px 14px;vertical-align:middle;}
  .td-avatar{padding:8px 0 8px 14px;width:40px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--paper-deep);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fraunces',serif;}
  .transport-chip{margin-left:8px;font-size:10px;background:#EADFC5;color:var(--brass);padding:2px 7px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:48px 20px;text-align:center;}
  .empty-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .empty-body{color:var(--ink-soft);font-size:13.5px;margin-top:6px;}

  .overlay{position:fixed;inset:0;background:rgba(31,42,60,0.45);display:flex;justify-content:flex-end;z-index:50;}
  .overlay.center{align-items:center;justify-content:center;}
  .panel{width:min(720px,100%);background:var(--paper);height:100%;display:flex;position:relative;}
  .panel-margin-rule{width:4px;background:var(--margin);flex-shrink:0;}
  .panel-scroll{flex:1;overflow-y:auto;padding:24px 28px 28px;}
  .panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;}
  .panel-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--margin);font-weight:600;margin-bottom:4px;}
  .name-input{font-family:'Fraunces',serif;font-weight:700;font-size:24px;border:none;background:transparent;outline:none;color:var(--ink);width:100%;border-bottom:2px solid var(--line);padding-bottom:4px;}
  .close-btn{border:none;background:transparent;font-size:18px;color:var(--ink-soft);flex-shrink:0;}
  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field-full{grid-column:1/-1;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:4px;}
  .input,select.input{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;outline:none;background:#fff;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .section-divider{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-top:26px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--ink);}
  .grid-hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .month-grid-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:320px;overflow-y:auto;}
  table.month-table{width:100%;border-collapse:collapse;font-size:13px;}
  .month-table th{position:sticky;top:0;background:var(--paper-deep);text-align:left;padding:8px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  .month-table td{padding:5px 10px;border-bottom:1px solid var(--line);background:#fff;}
  .month-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;outline:none;}
  .panel-footer{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);}
  .delete-btn{background:transparent;border:none;color:var(--margin);font-size:13px;font-weight:600;}
