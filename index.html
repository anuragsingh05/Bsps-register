  input,select{font-family:inherit;}

  .school-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

  .rail-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding:0 10px 8px;}
  .rail-tab{position:relative;text-align:left;border:none;background:transparent;border-radius:6px 0 0 6px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;color:var(--ink-soft);width:100%;}
  .rail-tab.active{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--margin);}
  .rail-tab-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .rail-tab-meta{font-size:10.5px;color:var(--ink-soft);}
  .rail-due-dot{position:absolute;top:10px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--margin);}

  main{flex:1;background:var(--paper);border-left:1px solid var(--line);padding:24px 24px 40px;}

function buildSeedStudents(){
  return SEED_UKG_RAW.map(s => ({
    id: uid(),
    class: "UKG",
    name: s.name || "",
    father: s.father || "",
    mother: s.mother || "",
    dob: s.dob || "",
    aadhar: s.aadhar || "",
    address: s.address || "",
    mobile1: s.mobile1 || "",
    mobile2: s.mobile2 || "",
    category: s.category || "",
    admission: "",
    development: "",
    backDues: s.backDues || "",
    transport: !!s.transport,
    months: blankMonths()
  }));
}

let SEED_ATTEMPTED = false;
async function seedIfEmpty(list){
  if(SEED_ATTEMPTED || list.length > 0) return;
  SEED_ATTEMPTED = true;
  const seed = buildSeedStudents();
  for(const s of seed){
    const {id, ...data} = s;
    await setDoc(doc(db, "students", id), data);
  }
}

function money(v){
  if(v === "" || v === null || v === undefined) return "—";
  const n = Number(v);
  if(Number.isNaN(n)) return v;
  return "₹" + n.toLocaleString("en-IN");
}

function initials(name){
  return (name||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

  document.getElementById("app").style.display = "block";
}, (err) => {
  document.getElementById("loading").textContent = "Connection error: " + err.message;
});

async function saveStudentToDb(student){
  const {id, ...data} = student;
  await setDoc(doc(db, "students", id), data);
}

async function deleteStudentFromDb(id){
  await deleteDoc(doc(db, "students", id));
}

function flash(msg){
  setState({toast: msg});
  setTimeout(() => setState({toast:""}), 2200);
}

/* ---------------- Derived data ---------------- */

function classCounts(){
  const c = {}; CLASSES.forEach(cl => c[cl]=0);
  STATE.students.forEach(s => c[s.class] = (c[s.class]||0)+1);
  return c;
}
function classDues(){
  const d = {}; CLASSES.forEach(cl => d[cl]=0);
  STATE.students.forEach(s => d[s.class] = (d[s.class]||0) + (Number(s.backDues)||0));
  return d;
}
function filteredStudents(){
  let list = STATE.students.filter(s => s.class === STATE.activeClass);
  if(STATE.search.trim()){
    const q = STATE.search.trim().toLowerCase();
    list = list.filter(s =>
      (s.name||"").toLowerCase().includes(q) ||
      (s.father||"").toLowerCase().includes(q) ||
      (s.mobile1||"").includes(q) || (s.mobile2||"").includes(q)
    );
  }
  if(STATE.dueOnly) list = list.filter(s => Number(s.backDues) > 0);
  return list.sort((a,b) => (a.name||"").localeCompare(b.name||""));
}

/* ---------------- Actions ---------------- */

function openAdd(){
  setState({panel:{mode:"add", student:{
    id: uid(), class: STATE.activeClass, name:"", father:"", mother:"", dob:"",
    aadhar:"", address:"", mobile1:"", mobile2:"", category:"",
    admission:"", development:"", backDues:"", transport:false, months: blankMonths()
  }}});
}
function openEdit(s){
  setState({panel:{mode:"edit", student:{...s, months:{...blankMonths(), ...(s.months||{})}}}});
}
function closePanel(){ setState({panel:null}); }

async function saveStudent(student){
  if(!student.name.trim()){ flash("Naam zaroori hai"); return; }
  await saveStudentToDb(student);
  setState({panel:null});
  flash("Save ho gaya");
}
function askDelete(id){ setState({confirmDelete:id}); }
async function confirmDeleteNow(){
  await deleteStudentFromDb(STATE.confirmDelete);
  setState({confirmDelete:null, panel:null});
  flash("Hata diya gaya");
}

/* ---------------- Render ---------------- */

function render(){
  const el = document.getElementById("app");
  el.innerHTML = `
    ${renderHeader()}
    <div class="body-wrap">
      ${renderRail()}
      <main>
        ${renderToolbar()}
        ${renderTable()}
      </main>
    </div>
    ${STATE.panel ? renderPanel() : ""}
    ${STATE.confirmDelete ? renderConfirm() : ""}
    ${STATE.toast ? `<div class="toast">${esc(STATE.toast)}</div>` : ""}
  `;
  attachHandlers();
}

function renderHeader(){
  return `
    <header>
      <div class="header-inner">
        <div class="crest">BS</div>
        <div>
          <div class="school-name">Bhagwan Singh Public School</div>
          <div class="school-sub">Student &amp; Fee Register · Digital Ledger</div>
        </div>
      </div>
      <div class="header-rule"></div>
    </header>
  `;
}

function renderRail(){
  const counts = classCounts(), dues = classDues();
  return `
    <nav class="rail">
      <div class="rail-label">Classes</div>
      ${CLASSES.map(cl => `
        <button class="rail-tab ${cl===STATE.activeClass?'active':''}" data-class="${cl}">
          <span class="rail-tab-name">${cl}</span>
          <span class="rail-tab-meta">${counts[cl]||0} student${counts[cl]===1?'':'s'}</span>
          ${dues[cl]>0 ? `<span class="rail-due-dot" title="${money(dues[cl])} due"></span>` : ""}
        </button>
      `).join("")}
    </nav>
  `;
}

function renderToolbar(){
  const count = filteredStudents().length;
  return `
    <div class="toolbar">
      <div class="toolbar-title">Class ${esc(STATE.activeClass)} <span class="toolbar-count">· ${count}</span></div>
      <div class="toolbar-actions">
        <input class="search-input" id="searchInput" placeholder="Naam, father, mobile se dhoondho…" value="${esc(STATE.search)}" />
        <label class="due-toggle"><input type="checkbox" id="dueOnlyChk" ${STATE.dueOnly?'checked':''}/> Sirf dues wale</label>
        <button class="add-btn" id="addBtn">+ Naya Student</button>
      </div>
    </div>
  `;
}

function renderTable(){
  const list = filteredStudents();
  if(list.length === 0){
    return `<div class="empty"><div class="empty-title">Is class mein koi record nahi</div><div class="empty-body">"+ Naya Student" dabaakar entry shuru karein.</div></div>`;
  }
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th></th><th>Naam</th><th>Father's Name</th><th>Mobile</th><th>Address</th>
          <th style="text-align:right;">Back Dues</th><th></th>
        </tr></thead>
        <tbody>
          ${list.map(s => {
            const due = Number(s.backDues)||0;
            return `
              <tr class="row" data-id="${esc(s.id)}">
                <td class="td-avatar"><div class="avatar">${esc(initials(s.name))}</div></td>
                <td style="font-family:'Fraunces',serif;font-weight:600;">${esc(s.name)}
                  ${s.transport ? `<span class="transport-chip">Transport</span>` : ""}
                </td>
                <td>${esc(s.father)||"—"}</td>
                <td style="font-family:'IBM Plex Mono',monospace;">${esc(s.mobile1)||"—"}</td>
                <td>${esc(s.address)||"—"}</td>
                <td style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;color:${due>0?'#A5322B':'#2F6B4F'};">
                  ${due>0 ? money(due) : "Clear"}
                </td>
                <td style="text-align:right;color:#B8863E;">Edit →</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderPanel(){
  const {mode, student:f} = STATE.panel;
  return `
    <div class="overlay" id="panelOverlay">
      <div class="panel" id="panelBox">
        <div class="panel-margin-rule"></div>
        <div class="panel-scroll">
          <div class="panel-header">
            <div style="flex:1;">
              <div class="panel-eyebrow">${mode==='add' ? 'Nayi Entry' : 'Register Card'}</div>
              <input class="name-input" id="f_name" placeholder="Student ka poora naam" value="${esc(f.name)}" />
            </div>
            <button class="close-btn" id="panelClose">✕</button>
          </div>

          <div class="panel-grid">
            <div><div class="field-label">Class</div>
              <select class="input" id="f_class">
                ${CLASSES.map(c=>`<option value="${c}" ${c===f.class?'selected':''}>${c}</option>`).join("")}
              </select>
            </div>
            <div><div class="field-label">Category</div><input class="input" id="f_category" value="${esc(f.category)}" placeholder="Gen / OBC / SC / ST" /></div>
            <div><div class="field-label">Father's Name</div><input class="input" id="f_father" value="${esc(f.father)}" /></div>
            <div><div class="field-label">Mother's Name</div><input class="input" id="f_mother" value="${esc(f.mother)}" /></div>
            <div><div class="field-label">Date of Birth</div><input type="date" class="input" id="f_dob" value="${esc(f.dob)}" /></div>
            <div><div class="field-label">Aadhar No.</div><input class="input" id="f_aadhar" value="${esc(f.aadhar)}" /></div>
            <div><div class="field-label">Mobile No. 1</div><input class="input" id="f_mobile1" value="${esc(f.mobile1)}" /></div>
            <div><div class="field-label">Mobile No. 2</div><input class="input" id="f_mobile2" value="${esc(f.mobile2)}" /></div>
            <div class="field-full"><div class="field-label">Address</div><input class="input" id="f_address" value="${esc(f.address)}" /></div>
          </div>

          <div class="section-divider">Fees</div>
          <div class="panel-grid">
            <div><div class="field-label">Admission Fee</div><input class="input" id="f_admission" value="${esc(f.admission)}" placeholder="₹" /></div>
            <div><div class="field-label">Development Fee</div><input class="input" id="f_development" value="${esc(f.development)}" placeholder="₹" /></div>
            <div><div class="field-label">Back Dues</div><input class="input" id="f_backDues" value="${esc(f.backDues)}" placeholder="₹" /></div>
            <div><div class="field-label">Transport availed?</div>
              <label class="checkbox-row"><input type="checkbox" id="f_transport" ${f.transport?'checked':''}/> Haan, transport use ho raha hai</label>
            </div>
          </div>

          <div class="section-divider">Monthly Fee Grid</div>
          <div class="grid-hint">Har mahine tuition (aur agar transport hai to transport) fee bharte jaayein.</div>
          <div class="month-grid-wrap">
            <table class="month-table">
              <thead><tr><th>Month</th><th>Tuition Paid</th>${f.transport?'<th>Transport Paid</th>':''}</tr></thead>
              <tbody>
                ${REGULAR_MONTHS.map(m => `
                  <tr>
                    <td>${m.label}</td>
                    <td><input class="month-input" data-month="${m.k}" data-field="tuition" value="${esc(f.months?.[m.k]?.tuition ?? '')}" placeholder="₹" /></td>
                    ${f.transport ? `<td><input class="month-input" data-month="${m.k}" data-field="transport" value="${esc(f.months?.[m.k]?.transport ?? '')}" placeholder="₹" /></td>` : ''}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <div class="panel-footer">
            ${mode==='edit' ? `<button class="delete-btn" id="panelDelete">Record hataayein</button>` : ""}
            <div style="flex:1;"></div>
            <button class="cancel-btn" id="panelCancel">Cancel</button>
            <button class="save-btn" id="panelSave">${mode==='add' ? 'Student Jodein' : 'Save Karein'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderConfirm(){
  return `
    <div class="overlay center" id="confirmOverlay">
      <div class="confirm-box">
        <div class="confirm-title">Record delete karein?</div>
        <div class="confirm-body">Ye action wapas nahi ho sakta.</div>
        <div class="confirm-actions">
          <button class="cancel-btn" id="confirmCancel">Cancel</button>
          <button class="delete-btn-solid" id="confirmOk">Haan, hataayein</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- Event wiring ---------------- */

function collectForm(){
  const val = id => document.getElementById(id).value;
  const months = {};
  document.querySelectorAll(".month-input").forEach(inp => {
    const mk = inp.dataset.month, field = inp.dataset.field;
    months[mk] = months[mk] || {tuition:"", transport:""};
    months[mk][field] = inp.value;
  });
  // preserve fields not currently rendered (e.g. transport off)
  const prevMonths = STATE.panel.student.months || {};
  REGULAR_MONTHS.forEach(m => {
    months[m.k] = {
      tuition: months[m.k]?.tuition ?? prevMonths[m.k]?.tuition ?? "",
      transport: months[m.k]?.transport ?? prevMonths[m.k]?.transport ?? ""
    };
  });
  return {
    ...STATE.panel.student,
    name: val("f_name"), class: val("f_class"), category: val("f_category"),
    father: val("f_father"), mother: val("f_mother"), dob: val("f_dob"),
    aadhar: val("f_aadhar"), mobile1: val("f_mobile1"), mobile2: val("f_mobile2"),
    address: val("f_address"), admission: val("f_admission"), development: val("f_development"),
    backDues: val("f_backDues"), transport: document.getElementById("f_transport").checked,
    months
  };
}

function attachHandlers(){
  // class rail
  document.querySelectorAll(".rail-tab").forEach(btn => {
    btn.onclick = () => setState({activeClass: btn.dataset.class});
  });
  // toolbar
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.oninput = (e) => { STATE.search = e.target.value; renderTableOnly(); };
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }
  const dueChk = document.getElementById("dueOnlyChk");
  if(dueChk) dueChk.onchange = (e) => setState({dueOnly: e.target.checked});
  const addBtn = document.getElementById("addBtn");
  if(addBtn) addBtn.onclick = openAdd;

  // table rows
  document.querySelectorAll("tr.row").forEach(tr => {
    tr.onclick = () => {
      const s = STATE.students.find(x => x.id === tr.dataset.id);
      if(s) openEdit(s);
    };
  });

  // panel
  const overlay = document.getElementById("panelOverlay");
  if(overlay){
    overlay.onclick = (e) => { if(e.target.id === "panelOverlay") closePanel(); };
    document.getElementById("panelClose").onclick = closePanel;
    document.getElementById("panelCancel").onclick = closePanel;
    document.getElementById("panelSave").onclick = () => saveStudent(collectForm());
    const delBtn = document.getElementById("panelDelete");
    if(delBtn) delBtn.onclick = () => askDelete(STATE.panel.student.id);

    // transport toggle re-render (without losing typed text: sync first)
    const transportChk = document.getElementById("f_transport");
    transportChk.onchange = () => {
      const updated = collectForm();
      updated.transport = transportChk.checked;
      STATE.panel.student = updated;
      render();
    };
    // keep typed values in STATE as user types (so toggling transport / class doesn't wipe them)
    document.querySelectorAll(".panel input, .panel select").forEach(inp => {
      inp.addEventListener("blur", () => { STATE.panel.student = collectForm(); });
    });
  }

  // confirm dialog
  const confirmOverlay = document.getElementById("confirmOverlay");
  if(confirmOverlay){
    confirmOverlay.onclick = (e) => { if(e.target.id === "confirmOverlay") setState({confirmDelete:null}); };
    document.getElementById("confirmCancel").onclick = () => setState({confirmDelete:null});
    document.getElementById("confirmOk").onclick = confirmDeleteNow;
  }
}

// lightweight re-render for search typing (avoids losing focus)
function renderTableOnly(){
  const main = document.querySelector("main");
  const scrollY = window.scrollY;
  main.innerHTML = renderToolbar() + renderTable();
  const searchInput = document.getElementById("searchInput");
  searchInput.focus();
  searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  document.getElementById("dueOnlyChk").onchange = (e) => setState({dueOnly: e.target.checked});
  document.getElementById("addBtn").onclick = openAdd;
  document.querySelectorAll("tr.row").forEach(tr => {
    tr.onclick = () => {
      const s = STATE.students.find(x => x.id === tr.dataset.id);
      if(s) openEdit(s);
    };
  });
  window.scrollTo(0, scrollY);
}
</script>
</body>
</html>
